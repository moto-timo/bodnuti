name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily: the scans, for advisories against code that has not changed.
    - cron: "17 5 * * *"
    # Weekly: fuzzing.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  msrv:
    name: build on rust-version (1.89)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-targets

  audit:
    name: dependency and secret scans
    if: github.event_name != 'schedule' || github.event.schedule == '17 5 * * *'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans the whole history
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: .github/install-scanners.sh
      - run: make audit

  image:
    name: image build and scan
    if: github.event_name != 'schedule' || github.event.schedule == '17 5 * * *'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t bodnuti:ci -f Containerfile .
      - name: smoke test
        run: |
          docker run --rm bodnuti:ci --version
          docker run --rm --entrypoint sh bodnuti:ci -c \
            'oelint-adv --version && b4 --version && sphinx-build --version && shellcheck --version'
      - run: .github/install-scanners.sh
      - run: make audit-image IMAGE=bodnuti:ci

  wheel:
    name: Linux wheel
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --locked --out dist
          manylinux: auto
      - name: install and run
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/bodnuti --version
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-linux-x86_64
          path: dist/*.whl

  fuzz:
    name: fuzz (5 minutes per target)
    if: github.event.schedule == '17 6 * * 1' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - run: make fuzz FUZZ_SECONDS=300
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
