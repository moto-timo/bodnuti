# A v* tag builds the wheels and the image and makes the GitHub release
# with the version's section of NEWS.md. Each wheel and the image get SLSA
# build provenance (GitHub artifact attestations, signed through Sigstore),
# and the image a keyless cosign signature. Run by hand (workflow_dispatch),
# it builds everything and publishes, attests and signs nothing.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: version matches the tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
          grep -q "^## bodnuti $version " NEWS.md \
            || { echo "NEWS.md has no section for $version" >&2; exit 1; }

  wheels:
    name: wheel (${{ matrix.target }})
    needs: version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # Sigstore signs the provenance
      attestations: write
    strategy:
      matrix:
        include:
          - target: x86_64
            manylinux: auto
          # manylinux2014's cross compiler is too old for ring's aarch64
          # assembly ("ARM assembler must define __ARM_ARCH").
          - target: aarch64
            manylinux: "2_28"
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: --release --locked --out dist
          manylinux: ${{ matrix.manylinux }}
      - uses: actions/attest-build-provenance@v4
        if: github.ref_type == 'tag'
        with:
          subject-path: dist/*.whl
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl

  image:
    name: image (amd64, arm64)
    needs: version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write # Sigstore: provenance and the cosign signature
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.ref_type == 'tag'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # arm64 builds under QEMU: slow, but the worker is arm64.
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_type == 'tag' }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
      - uses: actions/attest-build-provenance@v4
        if: github.ref_type == 'tag'
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - uses: sigstore/cosign-installer@v4
        if: github.ref_type == 'tag'
      # Keyless: the certificate names this workflow and the tag.
      - name: sign the image
        if: github.ref_type == 'tag'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${{ github.repository }}@$DIGEST"

  release:
    name: GitHub release
    if: github.ref_type == 'tag'
    needs: [version, wheels, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: notes from NEWS.md
        run: |
          awk -v v="## bodnuti ${{ needs.version.outputs.version }} " \
            'index($0, v) == 1 {on = 1; next} on && /^## / {exit} on' NEWS.md > notes.md
          test -s notes.md
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.whl \
            --title "bodnuti ${{ needs.version.outputs.version }}" --notes-file notes.md
