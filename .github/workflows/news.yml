# A pull request adds a release note fragment (changes/README.md), or
# carries the "no news" label when nothing in it is for users or operators.
# Its own workflow, so adding or removing the label reruns only this.
name: News

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  fragment:
    name: release note fragment
    if: >-
      !contains(github.event.pull_request.labels.*.name, 'no news')
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # towncrier compares with the base branch
      - run: pipx run towncrier==26.9.0 check --compare-with "origin/${{ github.base_ref }}"
