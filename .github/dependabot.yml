# Security and version updates for the pinned dependencies, among them
# the Containerfile's base images. The image's Debian packages are not
# covered: rebuild the image to pick up their fixes. Nor are the scanners
# pinned in .github/install-scanners.sh: bump trivy there along with the
# Containerfile.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
