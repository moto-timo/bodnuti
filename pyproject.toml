# Ships the bodnuti binary as a Python wheel (maturin bindings = "bin"), so
# `pip install bodnuti` installs it into the same venv as the Python tools it
# drives. The binary is not a Python extension; nothing is imported.

[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "bodnuti"
description = "Automated patch review for the Yocto Project and OpenEmbedded"
readme = "README.md"
requires-python = ">=3.9"
dynamic = ["version"]
# oelint-adv and b4 are run by bodnuti; the rest is what patchtest's mbox and
# patch suites import. patchtest itself comes from an openembedded-core
# checkout (--oecore).
dependencies = [
    "oelint-adv>=9.11.2",
    "b4>=0.16.0",
    "pyparsing>=3.0.9",
    "unidiff",
    "GitPython",
    "Jinja2",
]

[project.optional-dependencies]
# What yocto-docs' documentation/Pipfile lists, plus sphinx-lint.
docs = [
    "Sphinx",
    "sphinx-rtd-theme",
    "sphinx-copybutton",
    "sphinxcontrib-svg2pdfconverter>=2.0.0",
    "PyYAML",
    "sphinx-lint",
]
# For Django applications (--kind django-app).
django = [
    "ruff",
    "djlint",
]

[tool.maturin]
bindings = "bin"

# Release notes: one fragment per change in changes/, collected into
# NEWS.md at release time (changes/README.md).
[tool.towncrier]
name = "bodnuti"
directory = "changes"
filename = "NEWS.md"
title_format = "## bodnuti {version} ({project_date})"
issue_format = ""
underlines = ["", "", ""]

[[tool.towncrier.type]]
directory = "feature"
name = "Features"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Bug fixes"
showcontent = true

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true

[[tool.towncrier.type]]
directory = "doc"
name = "Documentation"
showcontent = true

[[tool.towncrier.type]]
directory = "misc"
name = "Other changes"
showcontent = true
