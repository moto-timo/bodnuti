[package]
name = "bodnuti"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
description = "Automated patch review for the Yocto Project and OpenEmbedded"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
quick-xml = "0.41"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
ureq = "2"
